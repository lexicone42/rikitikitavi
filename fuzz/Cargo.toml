[package]
name = "rikitikitavi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rikitikitavi-models = { path = "../crates/rikitikitavi-models" }
rikitikitavi-network = { path = "../crates/rikitikitavi-network" }
rikitikitavi-scanners = { path = "../crates/rikitikitavi-scanners", features = ["fuzzing"] }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "dns_packet"
path = "fuzz_targets/dns_packet.rs"
