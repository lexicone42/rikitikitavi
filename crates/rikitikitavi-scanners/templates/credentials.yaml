id: "rikitikitavi.credentials.class-default-advisory"
version: "1.0.0"
summary: "Confirm the admin password was changed from the factory default"
description: "Devices of this class commonly ship with default credentials."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["credentials"]

steps:
  - id: "check"
    kind: "manual.step"
    params:
      text: "Log in to the device's admin interface or app and set a strong, unique admin password if you never changed it."
  - id: "verify"
    kind: "manual.step"
    params:
      text: "To test the host directly, re-run the scan with --aggressive."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["credentials"]
  changeType: "standard"
---
