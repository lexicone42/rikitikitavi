remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["ftp"]
  changeType: "standard"
---
id: "rikitikitavi.credentials.banner-disclosure"
version: "1.0.0"
summary: "Keep the service patched and stop advertising its version"
description: "The service banner discloses its software and version."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["disclosure"]

steps:
  - id: "update"
    kind: "manual.step"
    params:
      text: "Keep the service updated; a version banner matters most when the version is old."
  - id: "banner"
    kind: "manual.step"
    params:
      text: "Where the software allows it, set a generic banner (vsftpd: ftpd_banner; ProFTPD: ServerIdent off)."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["disclosure"]
  changeType: "standard"
