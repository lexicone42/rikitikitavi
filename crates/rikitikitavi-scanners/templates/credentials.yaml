---
id: "rikitikitavi.credentials.ftp-default-confirmed"
version: "1.0.0"
summary: "Change the FTP account's default password now"
description: "An FTP login with a default password succeeded."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["ftp", "credentials"]

steps:
  - id: "change"
    kind: "manual.step"
    params:
      text: "Change the password of the FTP account that accepted the default login."
  - id: "disable"
    kind: "manual.step"
    params:
      text: "Disable FTP if you do not use it; use SFTP where file transfer is needed."
  - id: "audit"
    kind: "manual.step"
