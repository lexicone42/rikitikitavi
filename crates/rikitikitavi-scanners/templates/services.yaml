id: "rikitikitavi.services.weak-ssh-algorithms"
version: "1.0.0"
summary: "Remove weak key exchange, cipher and MAC algorithms from SSH"
description: "The SSH server offers SHA-1, small-group, CBC or MD5-based algorithms."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["ssh", "crypto"]

steps:
  - id: "config"
    kind: "manual.step"
    params:
      text: "For OpenSSH you manage, restrict KexAlgorithms, Ciphers and MACs in sshd_config to modern choices (curve25519, AES-GCM or ChaCha20-Poly1305, and -etm SHA-2 MACs), then restart sshd."
  - id: "device"
    kind: "manual.step"
    params:
      text: "For a device, install pending firmware updates; SSH algorithms are rarely configurable."
  - id: "verify"
    kind: "manual.step"
    params:
      text: "Re-run the scan to confirm the weak algorithms are gone."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["ssh"]
  changeType: "standard"
