  visibility: "public"
  maturity: "beta"
  tags: ["os", "eol"]

steps:
  - id: "upgrade"
    kind: "manual.step"
    params:
      text: "On a computer or server you manage, upgrade to a supported release of the operating system."
  - id: "appliance"
