id: "rikitikitavi.wifi.open-network"
version: "1.0.0"
summary: "Enable encryption on this WiFi network"
description: "WiFi network uses no encryption; all traffic is transmitted in cleartext."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["wifi", "encryption", "open-network"]

match:
  resourceKinds: ["wifi-network"]

steps:
  - id: "login-router"
    kind: "manual.step"
    params:
      text: "Log into your router's admin interface."
  - id: "set-security"
    kind: "manual.step"
    params:
      text: "Set WiFi security to WPA2-PSK (AES) or WPA3-SAE."
  - id: "strong-passphrase"
    kind: "manual.step"
    params:
      text: "Choose a strong passphrase (12+ characters)."
  - id: "reconnect"
    kind: "manual.step"
    params:
      text: "Reconnect all devices with the new credentials."

remediation:
  riskLevel: "critical"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.wep-encryption"
version: "1.0.0"
summary: "Replace WEP encryption with WPA2 or WPA3"
description: "WiFi network uses WEP encryption, which can be cracked in minutes."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["wifi", "wep", "weak-encryption"]

match:
  resourceKinds: ["wifi-network"]

steps:
  - id: "login-router"
    kind: "manual.step"
    params:
      text: "Log into your router's admin interface."
  - id: "change-security"
    kind: "manual.step"
    params:
      text: "Change WiFi security from WEP to WPA2-PSK (AES) or WPA3."
  - id: "replace-router"
    kind: "manual.step"
    params:
      text: "If the router only supports WEP, replace it — it is end-of-life."

remediation:
  riskLevel: "critical"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.wpa1-weak"
version: "1.0.0"
summary: "Upgrade from WPA (TKIP) to WPA2 (AES) or WPA3"
description: "WiFi network uses WPA with TKIP, which has known weaknesses."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["wifi", "wpa", "weak-encryption"]

match:
  resourceKinds: ["wifi-network"]

steps:
  - id: "login-router"
    kind: "manual.step"
    params:
      text: "Log into your router's admin interface."
  - id: "change-security"
    kind: "manual.step"
    params:
      text: "Change WiFi security to WPA2-PSK (AES) or WPA3-SAE."
  - id: "verify-compat"
    kind: "manual.step"
    params:
      text: "Verify all client devices support WPA2 (nearly all devices from 2006+ do)."

remediation:
  riskLevel: "high"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.wps-enabled"
version: "1.0.0"
summary: "Disable WPS on your router"
description: "WiFi Protected Setup (WPS) is enabled; WPS PINs can be brute-forced offline."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["wifi", "wps", "brute-force"]

match:
  resourceKinds: ["wifi-network"]

steps:
  - id: "login-router"
    kind: "manual.step"
    params:
      text: "Log into your router's admin interface."
  - id: "disable-wps"
    kind: "manual.step"
    params:
      text: "Navigate to WiFi/Wireless settings and disable WPS."
  - id: "verify-updates"
    kind: "manual.step"
    params:
      text: "Some routers re-enable WPS after firmware updates — verify after updates."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.hidden-ssid"
version: "1.0.0"
summary: "Make the SSID visible and rely on WPA2/WPA3"
description: "A hidden SSID adds no protection and makes clients probe for it."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi"]

steps:
  - id: "visible"
    kind: "manual.step"
    params:
      text: "If this is your network, turn off the hide-SSID option in the router's Wi-Fi settings."
  - id: "security"
    kind: "manual.step"
    params:
      text: "Rely on WPA2 (AES) or WPA3 with a strong passphrase."
  - id: "not-yours"
    kind: "manual.step"
    params:
      text: "If it is not your network, no action is needed."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.deauth-flood"
version: "1.0.0"
summary: "Enable management-frame protection"
description: "A burst of deauthentication frames can disconnect clients or push them to a rogue AP."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi"]

steps:
  - id: "pmf"
    kind: "manual.step"
    params:
      text: "Turn on Protected Management Frames (802.11w) or WPA3 on your access points."
  - id: "source"
    kind: "manual.step"
    params:
      text: "If the frames come from a BSSID that is not yours, note when it happens; repeated floods mean someone nearby is attacking the network."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.rogue-ap"
version: "1.0.0"
summary: "Check whether the access point is yours"
description: "An access point is broadcasting your SSID from an unknown BSSID."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi"]

steps:
  - id: "inventory"
    kind: "manual.step"
    params:
      text: "Compare the BSSID with your router, mesh nodes and extenders; a new or replaced unit explains it."
  - id: "protect"
    kind: "manual.step"
    params:
      text: "If it is not yours, change the Wi-Fi passphrase and enable WPA3 or Protected Management Frames."
  - id: "locate"
    kind: "manual.step"
    params:
      text: "Use the signal strength to locate the transmitter."

remediation:
  riskLevel: "high"
  requiresReboot: false
  typicalDurationSeconds: 900
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.directed-probes"
version: "1.0.0"
summary: "Forget networks that devices no longer use"
description: "Devices broadcast the names of networks they remember."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi", "privacy"]

steps:
  - id: "forget"
    kind: "manual.step"
    params:
      text: "On each device, remove saved Wi-Fi networks you no longer use, especially open ones."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.mac-randomization"
version: "1.0.0"
summary: "Turn on private Wi-Fi addresses"
description: "Devices probe with their real MAC address and can be tracked across networks."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi", "privacy"]

steps:
  - id: "enable"
    kind: "manual.step"
    params:
      text: "On each device, turn on the private or randomized MAC address option in its Wi-Fi settings."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["wifi"]
  changeType: "standard"
---
id: "rikitikitavi.wifi.default-ssid"
version: "1.0.0"
summary: "Rename the network from its default SSID"
description: "A default or common SSID reveals the equipment and weakens WPA2-PSK against precomputed attacks."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["wifi"]

steps:
  - id: "rename"
    kind: "manual.step"
    params:
      text: "Rename the SSID to something that does not identify you or the equipment."
  - id: "reconnect"
    kind: "manual.step"
    params:
      text: "Reconnect your devices to the renamed network."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["wifi"]
  changeType: "standard"
