id: "rikitikitavi.dns.hijacking-detected"
version: "1.0.0"
summary: "Switch to a trusted DNS resolver immediately"
description: "DNS returns private IP addresses for well-known public domains, indicating DNS hijacking."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["dns", "hijacking", "security"]

match:
  resourceKinds: ["dns-resolver"]

steps:
  - id: "change-dns"
    kind: "manual.step"
    params:
      text: "Change DNS to a trusted resolver: Quad9 (9.9.9.9), Cloudflare (1.1.1.1), or Google (8.8.8.8)."
  - id: "check-captive"
    kind: "manual.step"
    params:
      text: "Check if you are on a captive portal network and authenticate if needed."
  - id: "check-router"
    kind: "manual.step"
    params:
      text: "If this persists after changing DNS, your router may be compromised — reset it."

remediation:
  riskLevel: "critical"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["dns", "network"]
  changeType: "emergency"
---
id: "rikitikitavi.dns.cross-validation-mismatch"
version: "1.0.0"
summary: "Investigate DNS discrepancy and consider switching resolvers"
description: "DNS responses from the configured resolver differ from a public resolver, suggesting tampering."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["dns", "tampering", "validation"]

match:
  resourceKinds: ["dns-resolver"]

steps:
  - id: "compare-results"
    kind: "manual.step"
    params:
      text: "Compare results: run 'dig example.com @<your-dns>' vs 'dig example.com @1.1.1.1'."
  - id: "switch-resolver"
    kind: "manual.step"
    params:
      text: "If results differ, switch to a trusted public resolver (1.1.1.1 or 9.9.9.9)."
  - id: "check-isp"
    kind: "manual.step"
    params:
      text: "Check if your ISP is injecting DNS responses (common with some providers)."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["dns"]
  changeType: "standard"
---
id: "rikitikitavi.dns.dnssec-not-enforced"
version: "1.0.0"
summary: "Switch to a DNS resolver that enforces DNSSEC validation"
description: "The configured DNS resolver does not enforce DNSSEC, leaving responses vulnerable to spoofing."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["dns", "dnssec", "validation"]

match:
  resourceKinds: ["dns-resolver"]

steps:
  - id: "use-quad9"
    kind: "manual.step"
    params:
      text: "Use Quad9 (9.9.9.9) which enforces DNSSEC by default."
  - id: "use-cloudflare"
    kind: "manual.step"
    params:
      text: "Or use Cloudflare (1.1.1.1) which also validates DNSSEC."
  - id: "update-resolv"
    kind: "manual.step"
    params:
      text: "Update /etc/resolv.conf or your router's DNS settings."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["dns"]
  changeType: "standard"
---
id: "rikitikitavi.dns.spf-policy"
version: "1.0.0"
summary: "Publish a strict SPF record for the domain"
description: "The domain's SPF record is missing or does not reject unauthorised senders."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["dns", "email"]

steps:
  - id: "publish"
    kind: "manual.step"
    params:
      text: "At your DNS host, publish one TXT record starting v=spf1 that lists only the services that send mail for the domain."
  - id: "hardfail"
    kind: "manual.step"
    params:
      text: "End the record with -all (or ~all while testing); never +all."
  - id: "no-mail"
    kind: "manual.step"
    params:
      text: "If the domain sends no mail, publish v=spf1 -all."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 900
  blastRadiusTags: ["dns"]
  changeType: "standard"
---
id: "rikitikitavi.dns.dmarc-policy"
version: "1.0.0"
summary: "Publish a DMARC policy that rejects spoofed mail"
description: "The domain has no DMARC record, or its policy only monitors."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["dns", "email"]

steps:
  - id: "publish"
    kind: "manual.step"
    params:
      text: "At your DNS host, publish a TXT record at _dmarc.<domain>, for example v=DMARC1; p=none; rua=mailto:<you>."
  - id: "enforce"
    kind: "manual.step"
    params:
      text: "After reviewing the reports, raise the policy to p=quarantine and then p=reject."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 900
  blastRadiusTags: ["dns"]
  changeType: "standard"
---
id: "rikitikitavi.dns.no-servers"
version: "1.0.0"
summary: "Restore DNS server configuration on this host"
description: "No DNS servers are configured on the scanning host."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["dns", "network"]

steps:
  - id: "dhcp"
    kind: "manual.step"
    params:
      text: "Renew the DHCP lease and check that the router hands out DNS servers."
  - id: "resolver"
    kind: "manual.step"
    params:
      text: "If the host uses systemd-resolved or another local resolver, confirm it is running and has upstream servers."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["dns"]
  changeType: "standard"
