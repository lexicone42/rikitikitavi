id: "rikitikitavi.http_audit.missing-hsts"
version: "1.0.0"
summary: "Enable HSTS to force HTTPS connections"
description: "The server does not send a Strict-Transport-Security header, enabling downgrade attacks."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["http", "hsts", "headers"]

match:
  resourceKinds: ["web-server"]

steps:
  - id: "add-header"
    kind: "manual.step"
    params:
      text: "Add 'Strict-Transport-Security: max-age=31536000; includeSubDomains' header."
  - id: "apache-config"
    kind: "manual.step"
    params:
      text: "For Apache: Header always set Strict-Transport-Security in VirtualHost."
  - id: "nginx-config"
    kind: "manual.step"
    params:
      text: "For nginx: add_header Strict-Transport-Security in server block."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["web"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.directory-listing"
version: "1.0.0"
summary: "Disable directory listing on the web server"
description: "Directory listing is enabled, exposing file names and structure to anyone who can reach the server."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["http", "directory-listing", "information-disclosure"]

match:
  resourceKinds: ["web-server"]

steps:
  - id: "apache-fix"
    kind: "manual.step"
    params:
      text: "Apache: Remove 'Options Indexes' or add 'Options -Indexes' in the config."
  - id: "nginx-fix"
    kind: "manual.step"
    params:
      text: "nginx: Ensure 'autoindex on;' is not set in location blocks."
  - id: "add-index"
    kind: "manual.step"
    params:
      text: "Alternatively, add an index.html to each directory."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 300
  blastRadiusTags: ["web"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.admin-no-auth"
version: "1.0.0"
summary: "Restrict access to administrative interfaces"
description: "An admin path is accessible without authentication, allowing unauthorized administrative access."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "stable"
  tags: ["http", "admin", "authentication"]

match:
  resourceKinds: ["web-server"]

steps:
  - id: "add-auth"
    kind: "manual.step"
    params:
      text: "Add authentication to all admin paths (HTTP Basic Auth or application-level login)."
  - id: "restrict-ip"
    kind: "manual.step"
    params:
      text: "Restrict admin access by source IP using firewall rules or web server config."
  - id: "move-admin"
    kind: "manual.step"
    params:
      text: "Move admin interfaces to a non-standard port or path."

remediation:
  riskLevel: "high"
  requiresReboot: false
  typicalDurationSeconds: 900
  blastRadiusTags: ["web"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.security-headers"
version: "1.0.0"
summary: "Add the missing browser security headers"
description: "The web interface does not send one or more standard security headers."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http", "headers"]

steps:
  - id: "device"
    kind: "manual.step"
    params:
      text: "On a device's built-in web interface these headers are not configurable: install firmware updates and keep the interface off the internet."
  - id: "self-managed"
    kind: "manual.step"
    params:
      text: "On a server you manage, send X-Frame-Options: DENY (or CSP frame-ancestors 'none'), X-Content-Type-Options: nosniff and a Content-Security-Policy."
  - id: "verify"
    kind: "manual.step"
    params:
      text: "Check the response headers with: curl -sI http://<ip>:<port>/"

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.csp-weak"
version: "1.0.0"
summary: "Tighten the Content-Security-Policy"
description: "The Content-Security-Policy allows unsafe sources or omits key directives."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http", "csp"]

steps:
  - id: "remove-unsafe"
    kind: "manual.step"
    params:
      text: "Remove 'unsafe-inline', 'unsafe-eval', data: and * from script-src; move inline scripts to files or use nonces."
  - id: "add-directives"
    kind: "manual.step"
    params:
      text: "Add object-src 'none', base-uri 'self' and frame-ancestors 'self' (or 'none')."
  - id: "device"
    kind: "manual.step"
    params:
      text: "On a device's built-in web interface the policy is not configurable: install firmware updates and keep the interface off the internet."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.cors-permissive"
version: "1.0.0"
summary: "Restrict cross-origin access to the web interface"
description: "The CORS policy lets any website, or the null origin, read responses."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http", "cors"]

steps:
  - id: "allowlist"
    kind: "manual.step"
    params:
      text: "On a server you manage, return Access-Control-Allow-Origin only for the specific origins that need it, never * or null, and never * with credentials."
  - id: "device"
    kind: "manual.step"
    params:
      text: "On a device, install firmware updates and avoid browsing untrusted sites in the same browser session as its admin page."

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.cookie-flags"
version: "1.0.0"
summary: "Set Secure, HttpOnly and SameSite on session cookies"
description: "A session cookie is missing a protective attribute."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http", "cookies"]

steps:
  - id: "flags"
    kind: "manual.step"
    params:
      text: "On a server you manage, set session cookies with Secure, HttpOnly and SameSite=Lax (or Strict)."
  - id: "device"
    kind: "manual.step"
    params:
      text: "On a device, install firmware updates and log out of its admin page when finished."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.dangerous-methods"
version: "1.0.0"
summary: "Disable PUT, DELETE and TRACE on the web server"
description: "The server advertises HTTP methods that can modify content or enable cross-site tracing."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http", "methods"]

steps:
  - id: "disable"
    kind: "manual.step"
    params:
      text: "On a server you manage, allow only GET, HEAD and POST unless an application needs more (Apache: TraceEnable off; nginx: limit_except)."
  - id: "verify"
    kind: "manual.step"
    params:
      text: "Re-check with: curl -si -X OPTIONS http://<ip>:<port>/"

remediation:
  riskLevel: "medium"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.default-page"
version: "1.0.0"
summary: "Remove or configure the default web server page"
description: "The web server shows its default welcome page."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http"]

steps:
  - id: "identify"
    kind: "manual.step"
    params:
      text: "Identify what installed the web server on this host."
  - id: "disable"
    kind: "manual.step"
    params:
      text: "If it is not needed, stop and disable the service; otherwise replace the default site with your content."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
---
id: "rikitikitavi.http_audit.product-exposed"
version: "1.0.0"
summary: "Keep the identified web product updated and off the internet"
description: "A known product's web interface was identified."

metadata:
  owner: "rikitikitavi"
  visibility: "public"
  maturity: "beta"
  tags: ["http"]

steps:
  - id: "update"
    kind: "manual.step"
    params:
      text: "Update the product's firmware or software to the current release."
  - id: "password"
    kind: "manual.step"
    params:
      text: "Set a strong, unique admin password."
  - id: "internet"
    kind: "manual.step"
    params:
      text: "Make sure no router port forward or UPnP mapping exposes it to the internet."

remediation:
  riskLevel: "low"
  requiresReboot: false
  typicalDurationSeconds: 600
  blastRadiusTags: ["http"]
  changeType: "standard"
