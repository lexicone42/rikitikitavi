[package]
name = "rikitikitavi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rikitikitavi"
path = "src/main.rs"

[features]
default = ["tui", "unifi"]
tui = ["dep:rikitikitavi-tui", "dep:ratatui", "dep:crossterm"]
unifi = ["dep:rikitikitavi-unifi"]
monitor = ["rikitikitavi-scanners/monitor", "rikitikitavi-network/monitor"]
minimal = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34", optional = true }
rikitikitavi-core = { path = "../rikitikitavi-core" }
rikitikitavi-scanners = { path = "../rikitikitavi-scanners" }
rikitikitavi-network = { path = "../rikitikitavi-network" }
rikitikitavi-models = { path = "../rikitikitavi-models" }
rikitikitavi-analysis = { path = "../rikitikitavi-analysis" }
rikitikitavi-export = { path = "../rikitikitavi-export" }
rikitikitavi-tui = { path = "../rikitikitavi-tui", optional = true }
rikitikitavi-unifi = { path = "../rikitikitavi-unifi", optional = true }

tokio.workspace = true
futures.workspace = true
clap.workspace = true
serde.workspace = true
chrono.workspace = true
serde-saphyr.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
async-trait.workspace = true

[lints]
workspace = true
